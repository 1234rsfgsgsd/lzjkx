services:
  - type: web
    name: langsidu-sharing
    runtime: node
    plan: free
    buildCommand: npm install --prefix "./朗思渡共享版" --omit=dev
    startCommand: node "./朗思渡共享版/server.js"
    healthCheckPath: /health
    envVars:
      - key: VISION_API_URL
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: VISION_MODEL
        sync: false
      - key: SPEECH_MODEL
        sync: false
      - key: XFYUN_ISE_ENABLED
        value: "false"
      - key: XFYUN_APP_ID
        sync: false
      - key: XFYUN_API_KEY
        sync: false
      - key: XFYUN_API_SECRET
        sync: false
      - key: XFYUN_DAILY_CALL_LIMIT
        value: "5"
      - key: XFYUN_MONTHLY_CALL_LIMIT
        value: "20"
