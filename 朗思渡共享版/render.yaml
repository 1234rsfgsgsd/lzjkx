services:
  - type: web
    name: langsidu-sharing
    runtime: node
    plan: free
    buildCommand: npm install --prefix "./朗思渡共享版" --omit=dev
    startCommand: node "./朗思渡共享版/server.js"
    healthCheckPath: /health
    envVars:
      - key: VISION_API_URL
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: VISION_MODEL
        sync: false
